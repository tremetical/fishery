<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="c"><circle cx="256" cy="256" r="236"/></clipPath>
  </defs>
  <!-- bezel -->
  <circle cx="256" cy="256" r="252" fill="#0a0d12"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#263140" stroke-width="8"/>
  <!-- attitude indicator: sky over ground -->
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="512" height="256" fill="#1c3c55"/>
    <rect x="0" y="256" width="512" height="256" fill="#3d2f1c"/>
    <rect x="0" y="252" width="512" height="8" fill="#e6edf3"/>
    <!-- pitch ladder -->
    <rect x="216" y="196" width="80" height="6" rx="3" fill="#cfd9e2"/>
    <rect x="236" y="152" width="40" height="6" rx="3" fill="#cfd9e2"/>
    <rect x="216" y="310" width="80" height="6" rx="3" fill="#cfd9e2"/>
    <rect x="236" y="354" width="40" height="6" rx="3" fill="#cfd9e2"/>
  </g>
  <!-- fixed aircraft symbol -->
  <g fill="#37d388">
    <rect x="76" y="248" width="120" height="16" rx="8"/>
    <rect x="316" y="248" width="120" height="16" rx="8"/>
    <circle cx="256" cy="256" r="16" fill="none" stroke="#37d388" stroke-width="14"/>
  </g>
  <!-- bank pointer -->
  <path d="M256 44 l-16 30 h32 z" fill="#ffb454"/>
</svg>
